name: Darukaa.Earth AI Biodiversity Intelligence CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  deployments: write

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Challenge Benchmark Suite (All 5 Criteria)
      run: |
        python evaluation/benchmark_cases.py

    - name: Verify Submission Word Document Generator
      run: |
        python submission/generate_submission_doc.py

  record-production-deployment:
    name: Record Production Deployment
    runs-on: ubuntu-latest
    needs: [test-and-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: Production
      url: https://darukaa-biodiversity-ai-ppf4tx9gdwrupkyfm2itcy.streamlit.app/
    steps:
      - name: Confirm Streamlit Live Status
        run: |
          echo "Streamlit Community Cloud is actively serving Darukaa.Earth"
          echo "Live Production URL: https://darukaa-biodiversity-ai-ppf4tx9gdwrupkyfm2itcy.streamlit.app/"

